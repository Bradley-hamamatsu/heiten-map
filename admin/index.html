<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>管理者地図 | 浜松市閉店マップ</title>
  <link rel="icon" href="/heiten-map/favicon.svg" />
  <link rel="stylesheet" href="/heiten-map/assets/preload-helper-MbmbZ9XP.css" />
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1c242b;background:#eef2f4}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .hidden{display:none!important}
    .login{height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef4f2,#f5f0e8)}
    .login-card{width:min(440px,100%);background:#fff;border:1px solid #d7dfdc;border-radius:22px;padding:28px;box-shadow:0 18px 55px rgba(28,36,43,.12)}
    .login-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#1d5549;color:#fff;font-weight:800;font-size:24px;margin-bottom:18px}
    .login-card h1{margin:0 0 8px;font-size:25px}.login-card p{margin:0 0 20px;color:#64716f}
    .login-card label{display:grid;gap:7px;font-weight:700}.login-card input{width:100%;padding:12px 13px;border:1px solid #cbd5d1;border-radius:11px}
    .primary{border:0;background:#1d5549;color:#fff;border-radius:11px;padding:11px 16px;font-weight:800}
    .secondary{border:1px solid #cbd5d1;background:#fff;color:#25302f;border-radius:11px;padding:10px 14px;font-weight:700}
    .danger{border:1px solid #d7b5b5;background:#fff5f5;color:#9c2f2f;border-radius:11px;padding:10px 14px;font-weight:700}
    .login-card .primary{width:100%;margin-top:16px}.error{color:#a42e2e;font-weight:700;margin-top:12px!important}
    .map-shell{position:relative;width:100%;height:100%;background:#d9e0de}
    #map{position:absolute;inset:0;z-index:1}
    .topbar{position:absolute;z-index:800;left:14px;right:14px;top:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
    .search-panel{width:min(510px,calc(100vw - 148px));pointer-events:auto;background:rgba(255,255,255,.96);border:1px solid #d5ddda;border-radius:15px;box-shadow:0 8px 30px rgba(28,36,43,.16);overflow:hidden}
    .search-row{display:flex;align-items:center;gap:8px;padding:9px}
    .search-row input{flex:1;min-width:0;border:0;outline:0;padding:7px 8px;background:transparent;font-size:16px}
    .count{font-size:12px;color:#63716f;white-space:nowrap;padding-right:8px}
    .results{display:none;max-height:310px;overflow:auto;border-top:1px solid #e3e8e6;background:#fff}
    .results.open{display:block}.result{width:100%;border:0;border-bottom:1px solid #edf0ef;background:#fff;text-align:left;padding:11px 13px}
    .result:hover{background:#f2f7f5}.result strong{display:block}.result small{display:block;color:#687573;margin-top:2px}
    .actions{margin-left:auto;display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
    .floating{border:1px solid #d5ddda;background:rgba(255,255,255,.96);border-radius:12px;padding:10px 13px;font-weight:800;box-shadow:0 7px 24px rgba(28,36,43,.15)}
    .floating.accent{background:#1d5549;color:#fff;border-color:#1d5549}
    .statusbar{position:absolute;z-index:700;left:14px;bottom:14px;background:rgba(255,255,255,.94);border:1px solid #d5ddda;border-radius:999px;padding:7px 11px;font-size:12px;color:#4d5b59;box-shadow:0 5px 18px rgba(28,36,43,.12)}
    .leaflet-popup-content-wrapper{border-radius:14px}.admin-popup h3{margin:0 0 5px;font-size:16px}.admin-popup p{margin:0 0 10px;color:#687573}
    .admin-popup button{width:100%;border:0;border-radius:9px;padding:9px;background:#1d5549;color:white;font-weight:800}
    .modal-backdrop{position:fixed;z-index:2000;inset:0;background:rgba(18,25,24,.52);display:grid;place-items:center;padding:18px}
    .modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    .modal header{position:sticky;top:0;background:#fff;z-index:2;padding:18px 20px;border-bottom:1px solid #e4e9e7;display:flex;align-items:center;gap:12px}
    .modal header h2{font-size:20px;margin:0}.modal header button{margin-left:auto}
    .form{padding:18px 20px 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}
    .form label{display:grid;gap:6px;font-size:13px;font-weight:800}.form input,.form select,.form textarea{width:100%;border:1px solid #cdd7d3;border-radius:10px;padding:10px 11px;background:#fff;color:#1c242b}
    .form textarea{resize:vertical}.coord-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.help{font-size:12px;color:#687573;font-weight:500}
    .form-footer{position:sticky;bottom:0;background:#fff;border-top:1px solid #e4e9e7;margin:18px -20px -22px;padding:14px 20px;display:flex;justify-content:flex-end;gap:9px}
    @media(max-width:700px){
      .topbar{left:8px;right:8px;top:8px;display:block}.search-panel{width:100%}.actions{margin-top:8px;justify-content:flex-start}
      .floating{padding:9px 11px}.statusbar{left:8px;bottom:8px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}
      .results{max-height:42vh}.modal-backdrop{padding:8px}.modal{max-height:96vh}
    }
  </style>
</head>
<body>
<div id="app">
  <section id="login" class="login">
    <form id="loginForm" class="login-card">
      <div class="login-mark">管</div>
      <h1>管理者ページ</h1>
      <p>管理者用パスワードを入力すると、管理者専用の地図を開きます。</p>
      <label>パスワード
        <input id="password" type="password" autocomplete="current-password" required />
      </label>
      <p id="loginError" class="error hidden"></p>
      <button id="loginButton" class="primary" type="submit">管理者用の地図を開く</button>
    </form>
  </section>

  <main id="mapShell" class="map-shell hidden">
    <div id="map"></div>
    <div class="topbar">
      <div class="search-panel">
        <div class="search-row">
          <input id="search" type="search" placeholder="店名・住所・カテゴリで検索" autocomplete="off" />
          <span id="count" class="count"></span>
        </div>
        <div id="results" class="results"></div>
      </div>
      <div class="actions">
        <button id="addButton" class="floating" type="button">＋ 店舗追加</button>
        <button id="menuButton" class="floating accent" type="button">管理メニュー</button>
        <button id="logoutButton" class="floating" type="button">ログアウト</button>
      </div>
    </div>
    <div id="statusbar" class="statusbar">読み込み中…</div>
  </main>
</div>

<div id="editBackdrop" class="modal-backdrop hidden">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <header>
      <h2 id="editTitle">店舗を編集</h2>
      <button id="closeEdit" class="secondary" type="button">閉じる</button>
    </header>
    <form id="editForm" class="form">
      <input id="storeId" type="hidden" />
      <div class="grid">
        <label class="wide">店名
          <input id="name" required maxlength="100" />
        </label>
        <label>カテゴリ
          <select id="category"></select>
        </label>
        <label>2つ目のカテゴリ
          <select id="secondaryCategory"></select>
        </label>
        <label>状態
          <select id="status">
            <option value="closed">閉店</option>
            <option value="moved">移転</option>
            <option value="checking">確認中</option>
          </select>
        </label>
        <label>住所
          <input id="address" maxlength="160" />
        </label>
        <label>緯度
          <input id="lat" type="number" step="any" required />
        </label>
        <label>経度
          <input id="lng" type="number" step="any" required />
        </label>
        <div class="wide coord-actions">
          <button id="useCenter" class="secondary" type="button">地図の中心をこの店舗の位置にする</button>
          <span class="help">地図を店舗位置へ動かしてから押してください。</span>
        </div>
        <label class="wide">GoogleマップのURL
          <input id="googleMapsUrl" type="url" maxlength="500" />
        </label>
        <label>開店年・時期
          <input id="openedYear" maxlength="40" />
        </label>
        <label>閉店・移転年・時期
          <input id="closedYear" maxlength="40" />
        </label>
        <label class="wide">その後の店舗・用途
          <input id="nextStore" maxlength="120" />
        </label>
        <label class="wide">情報源
          <textarea id="source" rows="2" maxlength="600"></textarea>
        </label>
        <label class="wide">補足
          <textarea id="note" rows="3" maxlength="500"></textarea>
        </label>
      </div>
      <p id="editError" class="error hidden"></p>
      <div class="form-footer">
        <button id="cancelEdit" class="secondary" type="button">キャンセル</button>
        <button id="saveButton" class="primary" type="submit">公開内容を保存</button>
      </div>
    </form>
  </section>
</div>

<script type="module">
const API = "https://hamamatsu-closed-map.yummy-anole-6861.chatgpt.site/api/admin";
const KEY_NAME = "hamamatsu-closed-map-admin-key";
const categories = {
  food:"飲食店", convenience:"コンビニ", shop:"小売店・商店", bookstore:"書店",
  pharmacy:"薬局", beauty:"美容院・サロン", medical:"病院・医院", pachinko:"パチンコ屋",
  gas:"ガソリンスタンド", vehicle:"車・バイク・自転車", leisure:"娯楽・スポーツ",
  lodging:"宿泊", business:"工場・事業所・事務所", facility:"施設・サービス", other:"その他・未分類"
};
const colors = {
  food:"#e77522", convenience:"#2188a6", shop:"#357bb3", bookstore:"#5369a8",
  pharmacy:"#2b8b72", beauty:"#c65387", medical:"#d14f50", pachinko:"#8a52a3",
  gas:"#376ca8", vehicle:"#2e8190", leisure:"#3f8a57", lodging:"#8260ad",
  business:"#64727d", facility:"#a15f38", other:"#7b7166"
};
let key = "";
let data = null;
let map = null;
let L = null;
let markerLayer = null;
let markerById = new Map();

const $ = (id) => document.getElementById(id);
function show(el, yes){ el.classList.toggle("hidden", !yes); }
function escapeHtml(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}
function normalize(v){
  return String(v || "").normalize("NFKC").toLocaleLowerCase("ja").replace(/[\s\-‐-‒–—―−ー]+/g,"");
}
async function apiGet(candidate){
  const res = await fetch(API,{headers:{"X-Moderation-Key":candidate},cache:"no-store"});
  if(!res.ok){
    let body=null; try{body=await res.json();}catch{}
    throw new Error(body && body.error ? body.error : "管理画面を読み込めませんでした");
  }
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Moderation-Key":key},
    body:JSON.stringify(payload)
  });
  if(!res.ok){
    let body=null; try{body=await res.json();}catch{}
    if(res.status===403) logout();
    throw new Error(body && body.error ? body.error : "操作を完了できませんでした");
  }
  return res.json();
}
async function login(candidate){
  $("loginButton").disabled=true;
  $("loginButton").textContent="確認中…";
  show($("loginError"),false);
  try{
    const loaded=await apiGet(candidate);
    key=candidate;
    data=loaded;
    sessionStorage.setItem(KEY_NAME,key);
    show($("login"),false);
    show($("mapShell"),true);
    await initMap();
    renderMarkers();
    updateStatus();
    $("search").focus();
  }catch(err){
    $("loginError").textContent=err instanceof Error ? err.message : "ログインできませんでした";
    show($("loginError"),true);
    sessionStorage.removeItem(KEY_NAME);
  }finally{
    $("loginButton").disabled=false;
    $("loginButton").textContent="管理者用の地図を開く";
  }
}
function logout(){
  sessionStorage.removeItem(KEY_NAME);
  key="";
  data=null;
  location.reload();
}
async function initMap(){
  if(map){ setTimeout(function(){ map.invalidateSize(); },0); return; }
  const leafletModule=await import("../assets/leaflet-1-_l5dQP.js");
  L=leafletModule.t();
  map=L.map("map",{zoomControl:true,attributionControl:true,minZoom:9,maxZoom:20}).setView([34.7358,137.7604],13);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",{
    maxZoom:18,maxNativeZoom:18,attribution:"地理院タイル",crossOrigin:true
  }).addTo(map);
  markerLayer=L.layerGroup().addTo(map);
  map.on("zoomend",updateTooltips);
  setTimeout(function(){map.invalidateSize();},0);
}
function updateTooltips(){
  if(!map) return;
  const permanent=map.getZoom()>=16;
  markerById.forEach(function(marker){
    if(marker.getTooltip()) marker.unbindTooltip();
    if(permanent){
      const store=marker.__store;
      marker.bindTooltip(store.name,{permanent:true,direction:"top",offset:[0,-6],className:"admin-store-label"});
    }
  });
}
function markerPopup(store){
  return '<div class="admin-popup"><h3>'+escapeHtml(store.name)+'</h3><p>'+
    escapeHtml(categories[store.category] || store.category || "未分類")+
    (store.address ? "<br>"+escapeHtml(store.address) : "")+
    '</p><button type="button" data-edit-store="'+escapeHtml(store.id)+'">編集</button></div>';
}
function renderMarkers(){
  if(!map || !data) return;
  markerLayer.clearLayers();
  markerById.clear();
  (data.stores || []).forEach(function(store){
    const lat=Number(store.lat), lng=Number(store.lng);
    if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;
    const marker=L.circleMarker([lat,lng],{
      radius:8,weight:2,color:"#ffffff",fillColor:colors[store.category] || colors.other,fillOpacity:.96
    });
    marker.__store=store;
    marker.bindPopup(markerPopup(store),{maxWidth:280});
    marker.on("popupopen",function(){
      const el=marker.getPopup().getElement();
      const btn=el && el.querySelector("[data-edit-store]");
      if(btn) btn.onclick=function(){openEdit(store);};
    });
    marker.addTo(markerLayer);
    markerById.set(Number(store.id),marker);
  });
  updateTooltips();
}
function updateStatus(){
  const stores=data && data.stores ? data.stores : [];
  const pending=data && data.submissions ? data.submissions.filter(function(x){return x.state==="pending";}).length : 0;
  $("statusbar").textContent="公開店舗 "+stores.length+"件 ・ 承認待ち "+pending+"件";
  $("count").textContent=stores.length+"件";
}
function focusStore(store){
  const lat=Number(store.lat),lng=Number(store.lng);
  if(Number.isFinite(lat)&&Number.isFinite(lng)){
    map.setView([lat,lng],Math.max(17,map.getZoom()));
    const marker=markerById.get(Number(store.id));
    if(marker) marker.openPopup();
  }
  $("results").classList.remove("open");
}
function renderSearch(){
  if(!data) return;
  const q=normalize($("search").value);
  const stores=(data.stores || []).filter(function(store){
    return !q || normalize(store.name+" "+(store.address||"")+" "+(categories[store.category]||store.category||"")).includes(q);
  }).slice(0,80);
  $("count").textContent=stores.length+"件";
  if(!$("search").value.trim()){
    $("results").classList.remove("open");
    $("results").innerHTML="";
    return;
  }
  $("results").innerHTML=stores.map(function(store){
    return '<button class="result" type="button" data-result-id="'+escapeHtml(store.id)+'"><strong>'+
      escapeHtml(store.name)+'</strong><small>'+escapeHtml((categories[store.category]||store.category||"未分類")+
      (store.address ? " ・ "+store.address : ""))+'</small></button>';
  }).join("") || '<div class="result"><strong>一致する店舗はありません</strong></div>';
  $("results").classList.add("open");
  $("results").querySelectorAll("[data-result-id]").forEach(function(btn){
    btn.onclick=function(){
      const id=Number(btn.getAttribute("data-result-id"));
      const store=(data.stores || []).find(function(x){return Number(x.id)===id;});
      if(store) focusStore(store);
    };
  });
}
function fillCategorySelects(){
  const options=Object.keys(categories).map(function(k){return '<option value="'+k+'">'+categories[k]+'</option>';}).join("");
  $("category").innerHTML=options;
  $("secondaryCategory").innerHTML='<option value="">なし</option>'+options;
}
function openEdit(store){
  fillCategorySelects();
  $("editTitle").textContent=store ? store.name+"を編集" : "新しい店舗を追加";
  $("storeId").value=store ? String(store.id) : "";
  $("name").value=store ? store.name || "" : "";
  $("category").value=store ? store.category || "other" : "other";
  $("secondaryCategory").value=store ? store.secondaryCategory || "" : "";
  $("status").value=store ? store.status || "closed" : "closed";
  $("address").value=store ? store.address || "" : "";
  const center=map.getCenter();
  $("lat").value=store && store.lat != null ? String(store.lat) : center.lat.toFixed(7);
  $("lng").value=store && store.lng != null ? String(store.lng) : center.lng.toFixed(7);
  $("googleMapsUrl").value=store ? store.googleMapsUrl || "" : "";
  $("openedYear").value=store ? store.openedYear || "" : "";
  $("closedYear").value=store ? store.closedYear || "" : "";
  $("nextStore").value=store ? store.nextStore || "" : "";
  $("source").value=store ? store.source || "" : "";
  $("note").value=store ? store.note || "" : "";
  show($("editError"),false);
  show($("editBackdrop"),true);
  setTimeout(function(){$("name").focus();},0);
}
function closeEdit(){show($("editBackdrop"),false);}
async function reloadData(){
  data=await apiGet(key);
  renderMarkers();
  updateStatus();
  renderSearch();
}
$("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const candidate=$("password").value.trim();
  if(candidate) login(candidate);
});
$("search").addEventListener("input",renderSearch);
$("search").addEventListener("focus",renderSearch);
document.addEventListener("click",function(e){
  if(!$("searchPanel") && e.target===document.body) $("results").classList.remove("open");
});
$("menuButton").onclick=function(){ location.href="./dashboard/"; };
$("addButton").onclick=function(){openEdit(null);};
$("logoutButton").onclick=logout;
$("closeEdit").onclick=closeEdit;
$("cancelEdit").onclick=closeEdit;
$("editBackdrop").addEventListener("click",function(e){if(e.target===$("editBackdrop")) closeEdit();});
$("useCenter").onclick=function(){
  const c=map.getCenter();
  $("lat").value=c.lat.toFixed(7);
  $("lng").value=c.lng.toFixed(7);
};
$("editForm").addEventListener("submit",async function(e){
  e.preventDefault();
  show($("editError"),false);
  $("saveButton").disabled=true;
  $("saveButton").textContent="保存中…";
  try{
    const store={
      name:$("name").value.trim(),
      category:$("category").value,
      secondaryCategory:$("secondaryCategory").value || null,
      status:$("status").value,
      address:$("address").value.trim(),
      lat:Number($("lat").value),
      lng:Number($("lng").value),
      googleMapsUrl:$("googleMapsUrl").value.trim(),
      openedYear:$("openedYear").value.trim(),
      closedYear:$("closedYear").value.trim(),
      nextStore:$("nextStore").value.trim(),
      note:$("note").value.trim(),
      source:$("source").value.trim()
    };
    if(!store.name || !Number.isFinite(store.lat) || !Number.isFinite(store.lng)) throw new Error("店名と場所は必須です");
    const id=$("storeId").value ? Number($("storeId").value) : null;
    await apiPost({action:"save_store",storeId:id,store:store});
    await reloadData();
    closeEdit();
    const saved=(data.stores || []).find(function(x){return id ? Number(x.id)===id : x.name===store.name;});
    if(saved) focusStore(saved);
  }catch(err){
    $("editError").textContent=err instanceof Error ? err.message : "保存できませんでした";
    show($("editError"),true);
  }finally{
    $("saveButton").disabled=false;
    $("saveButton").textContent="公開内容を保存";
  }
});

const remembered=sessionStorage.getItem(KEY_NAME) || "";
if(remembered){
  $("password").value=remembered;
  login(remembered);
}
</script>
</body>
</html>
